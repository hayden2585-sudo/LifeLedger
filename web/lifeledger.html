<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeLedger — Expense & Income Spreadsheet</title>
<style>
:root{
  --bg:#eef1f6; --card:#ffffff; --ink:#1c2333; --mut:#67707f; --line:#e3e7ef;
  --brand:#3450b4; --brand2:#263d8f; --green:#15803d; --greenbg:#e8f6ee;
  --red:#c62f2f; --redbg:#fdecec; --amber:#b45309; --amberbg:#fdf3e4;
  --violet:#6d28d9; --sky:#0369a1; --head:#1f2a4d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit}
h1,h2,h3{margin:0 0 8px}
h3{font-size:15px}
a{color:var(--brand)}
.mut{color:var(--mut)} .small{font-size:12px} .b{font-weight:600}

/* ---------- header / nav ---------- */
header.top{background:var(--head);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.brand{font-size:17px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
.brand .logo{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#4f6fd8,#8b5cf6);font-size:15px}
.brand .tag{font-weight:400;font-size:11.5px;opacity:.75;margin-left:2px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top-actions select, .top-actions button{background:#2c3a66;color:#fff;border:1px solid #44528a;border-radius:7px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.top-actions button:hover{background:#3a4a7d}
.badge{font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid #44528a;white-space:nowrap}
.badge.warn{background:#7c2d12;border-color:#f59e0b;color:#fde68a}
.menu{position:relative}
.dropdown{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;min-width:250px;box-shadow:0 12px 30px rgba(15,23,42,.18);padding:6px;z-index:60}
.dropdown.open{display:block}
.dropdown button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:8px 10px;border-radius:7px;font-size:13px;cursor:pointer}
.dropdown button:hover{background:#f1f4fa}
.dropdown hr{border:0;border-top:1px solid var(--line);margin:5px 2px}
nav#tabs{background:#fff;border-bottom:1px solid var(--line);padding:0 16px;display:flex;gap:2px;overflow-x:auto;position:sticky;top:51px;z-index:40}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:11px 14px 8px;cursor:pointer;font-size:13.5px;color:var(--mut);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}

/* ---------- layout ---------- */
main{max-width:1320px;margin:16px auto 40px;padding:0 16px}
.view{display:none}
.view.on{display:block;animation:fade .15s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card h3{display:flex;align-items:center;gap:8px}
.cardhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.cardhead .grow{flex:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.grid2 > .card{margin-bottom:0}
.grid2{margin-bottom:16px}
.banner{background:var(--amberbg);border:1px solid #f2d3a2;color:#7c4a03;border-radius:10px;padding:9px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}

/* ---------- widgets ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.kpi .lbl{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-size:21px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11.5px;color:var(--mut);margin-top:2px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px}
.chip.green{background:var(--greenbg);color:var(--green)} .chip.red{background:var(--redbg);color:var(--red)}
.chip.amber{background:var(--amberbg);color:var(--amber)} .chip.grey{background:#eef0f5;color:var(--mut)}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--brand2)}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid #c6cfe6}
.btn.ghost:hover{background:#f2f5fc}
.btn.danger{background:var(--red)}
.btn.small{padding:4px 10px;font-size:12px;border-radius:6px}
.btn.confirm{background:#991b1b;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:block;font-size:12px;color:var(--mut);margin:0 0 3px 1px;font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:7px 9px;border:1px solid #c9d0de;border-radius:8px;font:inherit;font-size:13px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd0f7;border-color:var(--brand)}
textarea{resize:vertical}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.checkline{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink)}
.bar{height:9px;background:#edf0f6;border-radius:5px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:5px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);text-align:left;padding:7px 9px;border-bottom:2px solid var(--line);background:#fafbfd}
table.t td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:hover td{background:#f7f9fd}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--green)} .neg{color:var(--red)}
.srcico{font-size:13px}
details.sec{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff}
details.sec>summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary:after{content:"▾";margin-left:auto;color:var(--mut);transition:.15s}
details.sec[open]>summary:after{transform:rotate(180deg)}
details.sec .inner{padding:2px 14px 14px}
.toast{position:fixed;bottom:20px;right:20px;background:#1c2333;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:.2s;z-index:100;pointer-events:none;max-width:340px}
.toast.show{opacity:1;transform:none}
.dropzone{border:2px dashed #b9c3d6;border-radius:12px;padding:26px;text-align:center;color:var(--mut);cursor:pointer;background:#fafbfe}
.dropzone.hover{border-color:var(--brand);background:#f0f4ff}
.dropzone img{max-width:100%;max-height:260px;border-radius:8px;display:block;margin:0 auto}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.hint{font-size:11.5px;color:var(--mut);margin-top:4px}
.status{font-size:12px;color:var(--mut);margin-top:6px}
.legendl{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.legendl .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.chart{width:100%;height:auto}
.scrollx{overflow-x:auto}

/* spreadsheet look */
.sheet-wrap{overflow:auto;max-height:70vh;border:1px solid #d4d9e4;border-radius:10px;background:#fff}
table.sheet{border-collapse:separate;border-spacing:0;font-size:12.3px;min-width:1180px}
table.sheet th, table.sheet td{border-right:1px solid #dde2ec;border-bottom:1px solid #e6eaf2;padding:4px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
table.sheet thead th{position:sticky;top:0;background:#eef1f8;color:#3d4661;font-weight:600;z-index:3;border-bottom:2px solid #c9cfdd}
table.sheet td.c0, table.sheet th.c0{position:sticky;left:0;background:#fff;z-index:2;min-width:225px;max-width:260px;font-weight:500}
table.sheet thead th.c0{background:#eef1f8;z-index:4}
table.sheet tr.grp td{background:#f5f6fb;font-weight:700;color:#39415c}
table.sheet tr.grp td.c0{background:#f5f6fb}
table.sheet tr.tot td{background:#f2f5ff;font-weight:700;border-top:2px solid #9aa7c7;border-bottom:2px double #9aa7c7}
table.sheet tr.tot td.c0{background:#f2f5ff}
table.sheet td.inedit input{width:74px;padding:2px 5px;font-size:12px;border:1px solid #c9d0de;border-radius:5px}
table.sheet td.cellhit{cursor:pointer}
table.sheet td.cellhit:hover{background:#e9efff}
.over{color:var(--red);font-weight:600}
.under{color:var(--green)}

/* ---------- proactive alerts (dashboard) ---------- */
.alertrow{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-left-width:4px;border-radius:10px;margin-bottom:8px;background:#fff}
.alertrow.warn{border-left-color:#e0a13a;background:#fffdf7}
.alertrow.critical{border-left-color:var(--red);background:#fff7f7}
.alertrow.info{border-left-color:#8fa4d8}
.alertrow .alertico{font-size:16px;line-height:1.3}
.alertrow .alertbody{flex:1;min-width:0}
.alertrow .alerttitle{font-size:13px;font-weight:600;margin-bottom:2px}
.alertrow .alertdetail{line-height:1.5}
.alertrow .alertacts{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.tabbadge{display:inline-block;min-width:17px;margin-left:6px;padding:1px 5px;border-radius:20px;background:#e05252;color:#fff;font-size:10.5px;font-weight:700;text-align:center;vertical-align:1px}
.tab.active .tabbadge{background:var(--brand)}

/* ---------- year-over-year + member split ---------- */
.delta-up{color:var(--red)} .delta-down{color:var(--green)} .delta-flat{color:var(--mut)}
.splitbar{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line);margin:6px 0}
.splitbar i{display:block;height:100%}
@media (max-width:760px){
  .alertrow{flex-wrap:wrap}
  .alertrow .alertacts{margin-left:27px}
}

/* budget cards */
.bcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.bcard{border:1px solid var(--line);border-radius:11px;padding:12px 13px;background:#fff}
.bcard .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bcard input[type=number]{width:100%;padding:5px 8px}
.bcard .row{display:flex;justify-content:space-between;font-size:12px;margin-top:6px;align-items:center}
.ladder td:first-child{font-weight:600}
footer{max-width:1320px;margin:0 auto;padding:14px 16px 30px;color:var(--mut);font-size:11.5px;text-align:center}
@media (max-width:760px){
  nav#tabs{top:0;position:relative}
  header.top{position:relative}
  table.t .hide-m, .sheet .hide-m{display:none}
}
@media print{ header.top,nav#tabs,.noprint{display:none!important} .view{display:block!important} }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">▦</span> LifeLedger <span class="tag">expense &amp; income spreadsheet</span></div>
  <div class="top-actions">
    <span id="saveBadge" class="badge">…</span>
    <select id="currencySel" title="Currency" onchange="setCurrency(this.value)"></select>
    <div class="menu">
      <button onclick="toggleMenu(event)">Data ▾</button>
      <div id="dataMenu" class="dropdown">
        <button onclick="exportCSV()">⬇️ Export transactions (CSV)</button>
        <button onclick="exportGridCSV()">⬇️ Export annual grid (CSV)</button>
        <button onclick="exportJSON()">⬇️ Export backup (JSON)</button>
        <button onclick="importJSONClick()">⬆️ Import backup (JSON)</button>
        <hr>
        <button onclick="loadSample()">🎲 Load sample data</button>
        <button onclick="clearSample()">🧹 Clear sample data</button>
        <button class="dangerText" style="color:#c62f2f" onclick="resetAll(this)">⚠️ Reset everything</button>
      </div>
    </div>
    <input type="file" id="jsonFile" accept=".json,application/json" style="display:none" onchange="importJSONFile(this)">
  </div>
</header>

<nav id="tabs">
  <button class="tab active" data-v="dash"   onclick="showView('dash')">📊 Dashboard</button>
  <button class="tab" data-v="ledger" onclick="showView('ledger')">📒 Ledger</button>
  <button class="tab" data-v="grid"   onclick="showView('grid')">🗓️ Annual Grid</button>
  <button class="tab" data-v="budgets" onclick="showView('budgets')">🎯 Budgets</button>
  <button class="tab" data-v="household" onclick="showView('household')">🏠 Household</button>
  <button class="tab" data-v="projects" onclick="showView('projects')">🛠️ Projects</button>
  <button class="tab" data-v="income" onclick="showView('income')">🧭 Income Map</button>
  <button class="tab" data-v="plan"   onclick="showView('plan')">💡 Plan &amp; Advice</button>
  <button class="tab" data-v="ingest" onclick="showView('ingest')">➕ Add Data</button>
</nav>

<main>
  <div id="banner"></div>
  <section id="v-dash" class="view on"></section>
  <section id="v-ledger" class="view"></section>
  <section id="v-grid" class="view"></section>
  <section id="v-budgets" class="view"></section>
  <section id="v-household" class="view"></section>
  <section id="v-projects" class="view"></section>
  <section id="v-income" class="view"></section>
  <section id="v-plan" class="view"></section>
  <section id="v-ingest" class="view"></section>
</main>
<footer>LifeLedger · all data stays in your browser (local storage) · educational tool — not financial or tax advice</footer>
<div id="toast" class="toast"></div>

<script>
"use strict";
/* ================================================================
   LifeLedger — personal expense & income spreadsheet
   Single-file app: no external dependencies. Optional OCR lazy-loads
   tesseract.js from a CDN only when explicitly enabled by the user.
   ================================================================ */

/* ---------------- categories & taxonomy ---------------- */
const GROUPS = {
  income:      {name:'Income',            color:'#15803d'},
  obligations: {name:'Obligations',       color:'#4f46e5'},
  essentials:  {name:'Essentials',        color:'#0284c7'},
  lifestyle:   {name:'Lifestyle',         color:'#d97706'},
  occasions:   {name:'Special events, religion & charity', color:'#db2777'},
  future:      {name:'Future (savings)',  color:'#7c3aed'}
};
const CATS = [
  {id:'income',      name:'Income',                       grp:'income',      icon:'💰', guide:null},
  {id:'taxes',       name:'Taxes (out-of-pocket)',        grp:'obligations', icon:'🧾', guide:1},
  {id:'loans',       name:'Loan payments (mortgage/car)', grp:'obligations', icon:'🏦', guide:null},
  {id:'medical',     name:'Medical & health',             grp:'essentials',  icon:'🩺', guide:5},
  {id:'groceries',   name:'Groceries',                    grp:'essentials',  icon:'🛒', guide:14},
  {id:'auto',        name:'Auto (fuel, licensing)',       grp:'essentials',  icon:'🚗', guide:6},
  {id:'insurance',   name:'Insurance',                    grp:'essentials',  icon:'🛡️', guide:6},
  {id:'transport',   name:'Transport (maxi, taxi, rides)',grp:'essentials',  icon:'🚌', guide:5},
  {id:'utilities',   name:'Utilities (light, water, net)',grp:'essentials',  icon:'💡', guide:8},
  {id:'upkeep',      name:'Upkeep & repairs',             grp:'essentials',  icon:'🔧', guide:3},
  {id:'toiletries',  name:'Toiletries & personal care',   grp:'essentials',  icon:'🧼', guide:2},
  {id:'dining',      name:'Dining (restaurants & takeout)',grp:'lifestyle',  icon:'🍽️', guide:7},
  {id:'entertainment',name:'Entertainment',               grp:'lifestyle',   icon:'🎬', guide:4},
  {id:'education',   name:'Education',                    grp:'lifestyle',   icon:'📚', guide:3},
  {id:'subscriptions',name:'Subscriptions',               grp:'lifestyle',   icon:'📺', guide:2},
  {id:'parties',     name:'Parties & outings',            grp:'lifestyle',   icon:'🎉', guide:4},
  {id:'events',      name:'Special events (Carnival, Christmas)',grp:'occasions', icon:'🎪', guide:null},
  {id:'charity',     name:'Religion & charity (tithing, giving)', grp:'occasions', icon:'🙏', guide:null},
  {id:'savings',     name:'Savings (pay yourself)',       grp:'future',      icon:'🐖', guide:null},
  {id:'other',       name:'Other / unclassified',         grp:'lifestyle',   icon:'🏷️', guide:3}
];
const CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));
const EXPENSE_CATS = CATS.filter(c=>c.id!=='income');

const CURRENCIES = [['TTD','TT$'],['USD','US$'],['EUR','€'],['GBP','£'],['CAD','CA$'],['XCD','EC$'],['JMD','J$'],['BBD','Bds$'],['INR','₹'],['NGN','₦'],['ZAR','R'],['AUD','A$'],['GHS','GH₵'],['GYD','G$'],['SRD','SR$']];

/* ---------------- income taxonomy ----------------
   Income remains a single cashflow category for aggregation, but each inflow
   can carry a more precise type so recurring pay is not confused with arrears,
   windfalls, capital receipts, benefits, investment income, or rent. */
const INCOME_TYPES = [
  {id:'salary',         name:'Salary / wages',          icon:'💼', kind:'recurring'},
  {id:'side_hustle',    name:'Side hustles / gigs',    icon:'🛠️', kind:'recurring'},
  {id:'salary_arrears', name:'Salary arrears / back pay', icon:'↩️', kind:'irregular'},
  {id:'overtime_extra', name:'Overtime / extra duties', icon:'⏱️', kind:'irregular'},
  {id:'dividends',     name:'Dividends',               icon:'📈', kind:'investment'},
  {id:'asset_sale',    name:'Sale of assets',          icon:'🏷️', kind:'capital'},
  {id:'gratuity',      name:'Gratuity',                icon:'🎖️', kind:'benefit'},
  {id:'welfare',       name:'Welfare benefits',        icon:'🤝', kind:'benefit'},
  {id:'rent',          name:'Rental income',           icon:'🏠', kind:'property'},
  {id:'gift_remittance',name:'Gifts / remittances',    icon:'🎁', kind:'transfer'},
  {id:'other_income',  name:'Other income',            icon:'💵', kind:'other'}
];
const INCOME_TYPE = Object.fromEntries(INCOME_TYPES.map(x=>[x.id,x]));
const INCOME_STREAM_TYPES = INCOME_TYPES.filter(x=>['recurring','investment','property'].includes(x.kind));
function incomeTypeOptions(sel, streamOnly=false){
  const xs=streamOnly?INCOME_STREAM_TYPES:INCOME_TYPES;
  return xs.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${x.icon} ${x.name}</option>`).join('');
}
function incomeTypeLabel(id){ const x=INCOME_TYPE[id]||INCOME_TYPE.other_income; return x.name }
function incomeTypeBadge(id){ const x=INCOME_TYPE[id]||INCOME_TYPE.other_income; return `${x.icon} ${x.name}` }
function guessIncomeType(text){
  const s=' '+String(text||'').toLowerCase()+' ';
  if(/salary\s*arrears|salary\s*back\s*pay|back\s*pay|arrears|retroactive pay/i.test(s)) return 'salary_arrears';
  if(/overtime|extra\s+dut(?:y|ies)|additional\s+dut(?:y|ies)|extra\s+duties|honorarium/i.test(s)) return 'overtime_extra';
  if(/dividend|shareholder\s+payment|share\s+dividend/i.test(s)) return 'dividends';
  if(/sale\s+of\s+(an?\s+)?asset|asset\s+sale|sold\s+(my\s+)?(car|vehicle|property|house|land|equipment)|sale\s+proceeds|capital\s+receipt/i.test(s)) return 'asset_sale';
  if(/gratuity|severance\s+gratuity|retirement\s+gratuity/i.test(s)) return 'gratuity';
  if(/welfare\s+(benefit|payment)|welfare|public\s+assistance|social\s+benefit|employee\s+welfare/i.test(s)) return 'welfare';
  if(/rental\s+income|rent\s+received|rent\s+from\s+(tenant|property)|tenant\s+payment|lease\s+payment/i.test(s)) return 'rent';
  if(/gift|remittance|money\s+sent\s+from\s+abroad|money\s+from\s+(family|relative|relatives|overseas)|family\s+support|support\s+from\s+abroad|overseas\s+transfer|international\s+transfer/i.test(s)) return 'gift_remittance';
  if(/side\s+hustle|side\s+gig|freelance|gig\s+income|consulting\s+fee|market\s+stall|tutoring|contract\s+work/i.test(s)) return 'side_hustle';
  if(/salary|wages|payroll|pay\s+advice|pay\s+slip|paycheck|net\s+pay|monthly\s+pay/i.test(s)) return 'salary';
  return null;
}

/* vendor / keyword hints used by the auto-classifier */
const VENDOR_HINTS = {
  events:     ['carnival','fete','mas band','pretty mas','mas costume','costume','jouvert',"j'ouvert",'monday wear','christmas','xmas','parang','black friday','holiday shopping','old year','eid','divali','diwali','phagwa','easter','hamper','toy drive','yearly event'],
  charity:    ['church','mosque','temple','mandir','charity','charitable','donation','donate','tithe','tithing','offering','alms','zakat','zakaat','red cross','unicef','gofundme','love offering','orphanage','home for aged','foundation gift'],

/* Bring settings from older saves up to the current schema.
   Pre-1.2 saves bundled NIS + surcharge into payrollDeductionPct (default 6.3);
   when we detect that, clear it so deductions aren't double-counted. */
function migrateSettings(s){
  if(!s || typeof s!=='object') return freshState().settings;
  const base=freshState().settings;
  const isOld=s.nisPct===undefined;
  for(const k in base){ if(s[k]===undefined) s[k]=base[k] }
  if(isOld && +s.payrollDeductionPct===6.3) s.payrollDeductionPct=0;
  return s;
}
function migrateWorkspace(s){
  if(!s||typeof s!=='object') return s;
  if(!Array.isArray(s.household?.members)) s.household={members:[]};
  if(!Array.isArray(s.projects)) s.projects=[];
  if(!Array.isArray(s.recurringExpenses)) s.recurringExpenses=[];
  for(const p of s.projects){
    if(!p.items||!Array.isArray(p.items)) p.items=[];
    if(!p.type) p.type='home';
    if(!p.priority) p.priority='normal';
    if(!p.status) p.status='planning';
    /* projects finished before the archive workflow existed are archived on load,
       so a completed project never keeps cluttering the working list */
    if(p.archived===undefined) p.archived = (p.status==='completed');
    if(p.completedAt===undefined) p.completedAt = p.archived? (p.targetDate||p.startDate||null) : null;
    if(!p.fundingPlan) p.fundingPlan={enabled:false,startingReserve:0,oneTimeContribution:0,surplusAllocationPct:0,fixedMonthlyContribution:0};
  }
  return s;
}
function migrateIncomeTypes(s){
  if(!s || typeof s!=='object') return s;
  if(!Array.isArray(s.streams)) s.streams=[];
  if(!Array.isArray(s.tx)) s.tx=[];
  for(const stream of s.streams){
    if(!stream.incomeType) stream.incomeType=guessIncomeType(stream.label);
    if(!INCOME_TYPE[stream.incomeType]) stream.incomeType='other_income';

    }
  }
  return s;
}

function fmt(n, dec){ if(n===undefined||n===null||isNaN(n)) return '—';
  dec = (dec===undefined)?2:dec;
  const neg = n < -0.004; const v = Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  return (neg?'−':'') + SYM() + v; }
function fmt0(n){ return fmt(n,0) }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }
function todayISO(){ return iso(new Date()) }
function parseAmt(s){ if(typeof s==='number') return s; if(!s) return 0;
  s = String(s).replace(/[−–]/g,'-').replace(/[^\d.\-()]/g,''); let neg = /\(.*\)/.test(s) || s.trim().startsWith('-');
  s = s.replace(/[()\-]/g,''); const v = parseFloat(s); return isNaN(v)? 0 : (neg? -v : v); }

/* date of tx -> {y,m} */
function txYM(t){ const p=t.date.split('-'); return {y:+p[0], m:+p[1]-1} }
function txForMonth(y,m){ return state.tx.filter(t=>{ const p=txYM(t); return p.y===y && p.m===m }) }
function txForYear(y){ return state.tx.filter(t=> txYM(t).y===y ) }
function sumT(ts){ return round2(ts.reduce((a,t)=>a+t.amt,0)) }

/* aggregate a tx list */
function agg(ts){
  let inc=0, exp=0; const byCat={};
  for(const t of ts){ if(t.cat==='income'){ inc+=t.amt } else { exp+=t.amt; byCat[t.cat]=(byCat[t.cat]||0)+t.amt } }
  return {inc:round2(inc), exp:round2(exp), byCat};
}
/* last n calendar months incl current -> [{y,m}] oldest first */
function trailingMonths(n){ const out=[], now=new Date();
  for(let i=n-1;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); out.push({y:d.getFullYear(), m:d.getMonth()}) } return out }
/* trailing-12 aggregates (averages per month) */
function t12(){
  const ms = trailingMonths(12); let inc=0, exp=0; const byCat={};
  for(const {y,m} of ms){ const a=agg(txForMonth(y,m)); inc+=a.inc; exp+=a.exp;
    for(const k in a.byCat) byCat[k]=(byCat[k]||0)+a.byCat[k] }
  const n=ms.length;
  const byCatAvg={}; for(const k in byCat) byCatAvg[k]=byCat[k]/n;
  return { incAvg:inc/n, expAvg:exp/n, byCatAvg, ms, n };
}
function latestMonthWithTx(){ let best=null; for(const t of state.tx){ const p=txYM(t);
    if(!best || p.y>best.y || (p.y===best.y && p.m>best.m)) best=p } return best }
function monthOptions(sel){ let h=''; const seen={};
  for(const t of [...state.tx].sort((a,b)=>a.date<b.date?1:-1)){ const p=txYM(t); const k=p.y+'-'+p.m;
    if(seen[k]) continue; seen[k]=1; h+=`<option value="${k}" ${sel===k?'selected':''}>${MONTHS[p.m]} ${p.y}</option>` }
  return h }
function yearOptions(sel){ const ys=[...new Set(state.tx.map(t=>txYM(t).y))].sort((a,b)=>b-a);
  if(!ys.length) ys.push(new Date().getFullYear());
  return ys.map(y=>`<option value="${y}" ${y===sel?'selected':''}>${y}</option>`).join('') }

/* ---------------- classification ---------------- */
function guessCat(text){
  const s = ' ' + String(text||'').toLowerCase() + ' ';
  if(guessIncomeType(s)) return 'income';
  for(const [cat, words] of Object.entries(VENDOR_HINTS)){
    for(const w of words){ if(s.includes(w)) return cat }
  }
  for(const [re,cat] of GENERIC_HINTS){ if(re.test(s)) return cat }
  return null;
}
function vendorFromEmail(fromLine){
  const m = String(fromLine).match(/<([^>]+)>/); const addr = m? m[1] : String(fromLine);
  const dom = (addr.split('@')[1]||'').split('.')[0];
  return dom? dom.charAt(0).toUpperCase()+dom.slice(1) : null;
}

    <p style="margin:0 0 14px;font-size:13.5px;line-height:1.6">
      LifeLedger cannot access your browser's local storage in this environment.
      Any entries you make <strong>will be lost</strong> when you close this tab.
    </p>
    <p style="margin:0 0 18px;font-size:13px;color:#67707f;line-height:1.6">

      Use <strong>Data ▸ Export JSON</strong> before closing to preserve any work you do now.
    </p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button onclick="document.getElementById('storageWarnModal').remove()" style="background:#3450b4;color:#fff;border:0;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer">I understand — continue anyway</button>
      <button onclick="exportJSON();document.getElementById('storageWarnModal').remove()" style="background:#fff;color:#3450b4;border:1px solid #c6cfe6;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer">Export JSON first</button>

  </div>`;
  document.body.appendChild(m);
}

/* ================================================================
   CHART HELPERS (pure inline SVG — no libraries)
   ================================================================ */
function donutSVG(items){
  const S=190, r=72, sw=30, c=S/2, C=2*Math.PI*r;
  const total=items.reduce((a,b)=>a+b.val,0);
  let off=C*0.25, segs='';
  for(const it of items){ if(it.val<=0) continue;
    const len=Math.max(0,it.val/ (total||1) *C);
    segs+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${it.color}" stroke-width="${sw}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/>`;
    off-=len; }
  return `<svg viewBox="0 0 ${S} ${S}" class="chart" style="max-width:200px;display:block;margin:auto">${segs}
    <text x="${c}" y="${c-4}" text-anchor="middle" font-size="11" fill="#67707f">TOTAL</text>
    <text x="${c}" y="${c+15}" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1c2333">${fmt0(total)}</text></svg>`;
}
function bars12SVG(data){
  const W=780, H=250, padL=58, padR=8, padB=26, padT=12;
  const max=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
  const iw=(W-padL-padR)/data.length, bw=Math.max(5,Math.min(15,iw*0.30));
  let grid='', bars='', labels='';
  for(let g=0; g<=4; g++){ const v=max*g/4, y=H-padB-(v/max)*(H-padB-padT);
    grid+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#e9edf4"/><text x="${padL-7}" y="${y+4}" text-anchor="end" font-size="10.5" fill="#8a93a5">${fmtK(v)}</text>` }
  data.forEach((d,i)=>{ const cx=padL+i*iw+iw/2;
    const hi=Math.max(1,d.inc), he=Math.max(1,d.exp);
    const yi=H-padB-(hi/max)*(H-padB-padT), ye=H-padB-(he/max)*(H-padB-padT);
    bars+=`<rect x="${(cx-bw-1.5).toFixed(1)}" y="${yi.toFixed(1)}" width="${bw}" height="${(H-padB-yi).toFixed(1)}" rx="2.5" fill="#2f9e5f"/>
           <rect x="${(cx+1.5).toFixed(1)}" y="${ye.toFixed(1)}" width="${bw}" height="${(H-padB-ye).toFixed(1)}" rx="2.5" fill="#e05252"/>`;
    labels+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#67707f">${d.label}</text>` });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${grid}${bars}${labels}</svg>`;
}
function lineNetSVG(maxG, netFn, needAnnual, marks){
  const W=780, H=270, padL=64, padR=14, padB=34, padT=14;
  const maxY=Math.max(netFn(maxG), needAnnual)*1.06;
  const X=g=>padL+(g/maxG)*(W-padL-padR), Y=v=>H-padB-(v/maxY)*(H-padB-padT);
  let pts=''; const steps=64;
  for(let i=0;i<=steps;i++){ const g=maxG*i/steps; pts+=(i?' L':'M')+X(g).toFixed(1)+' '+Y(netFn(g)).toFixed(1) }
  let grid=''; for(let g=0;g<=4;g++){ const v=maxY*g/4, y=Y(v);
    grid+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#e9edf4"/><text x="${padL-7}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#8a93a5">${fmtK(v)}</text>` }
  for(let g=0;g<=4;g++){ const gv=maxG*g/4, x=X(gv);
    grid+=`<text x="${x.toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="#8a93a5">${fmtK(gv)}</text>` }
  let mk='';
  for(const m of marks){ const x=X(m.gross), y=Y(netFn(m.gross));
    mk+=`<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${H-padB}" stroke="${m.color}" stroke-dasharray="4 4" opacity=".8"/>
         <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="${m.color}"/>
         <text x="${Math.min(x+6,W-150).toFixed(1)}" y="${Math.max(padT+12,y-10).toFixed(1)}" font-size="11" font-weight="600" fill="${m.color}">${esc(m.label)}</text>` }
  const yNeed=Y(needAnnual);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${grid}
    <line x1="${padL}" y1="${yNeed.toFixed(1)}" x2="${W-padR}" y2="${yNeed.toFixed(1)}" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="${W-padR-4}" y="${(yNeed-7).toFixed(1)}" text-anchor="end" font-size="11" font-weight="600" fill="#b45309">Lifestyle + savings need ${fmt0(needAnnual)}</text>
    <path d="${pts}" fill="none" stroke="#3450b4" stroke-width="2.5"/>${mk}</svg>`;
}
function growthSVG(contrib, ratePct, years, lump){
  const W=780, H=250, padL=64, padR=14, padB=28, padT=12;
  const i=ratePct/100/12, n=years*12;
  const series=[]; let bal=lump||0;
  for(let m=0;m<=n;m++){ if(m>0){ bal=bal*(1+i)+contrib } series.push(bal) }
  const maxV=Math.max(...series,1);
  const X=m=>padL+(m/n)*(W-padL-padR), Y=v=>H-padB-(v/maxV)*(H-padB-padT);
  let grid=''; for(let g=0;g<=4;g++){ const v=maxV*g/4,y=Y(v);
    grid+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#e9edf4"/><text x="${padL-7}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#8a93a5">${fmtK(v)}</text>` }
  let ticks=''; for(let yr=0;yr<=years;yr+=Math.max(1,Math.round(years/6))){ ticks+=`<text x="${X(yr*12).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#67707f">${yr}y</text>` }
  let path=''; series.forEach((v,m)=>{ path+=(m?' L':'M')+X(m).toFixed(1)+' '+Y(v).toFixed(1) });
  const contribTotal=lump+contrib*n;
  const area=`M${X(0)} ${Y(0)} L${path.slice(1)} L${X(n)} ${Y(0)} Z`;
  return { svg:`<svg viewBox="0 0 ${W} ${H}" class="chart">${grid}
      <path d="${area}" fill="#6d28d9" opacity="0.08"/>
      <path d="M${X(0)} ${Y(contribTotal).toFixed(1)} L${X(n)} ${Y(contribTotal).toFixed(1)}" stroke="#94a3b8" stroke-dasharray="5 5"/>
      <text x="${W-padR-4}" y="${(Y(contribTotal)-6).toFixed(1)}" text-anchor="end" font-size="11" fill="#67707f">contributed ${fmt0(contribTotal)}</text>
      <path d="${path}" fill="none" stroke="#6d28d9" stroke-width="2.5"/>${ticks}</svg>`,
    fv: series[series.length-1], contributed: contribTotal };
}
function fmtK(v){ if(Math.abs(v)>=1000000) return (v/1000000).toFixed(1).replace(/\.0$/,'')+'M';
  if(Math.abs(v)>=1000) return (v/1000).toFixed(v>=10000?0:1).replace(/\.0$/,'')+'k'; return Math.round(v) }

/* ================================================================
   SHARED NUMBER CRUNCHING
   ================================================================ */
function monthStats(y,m){
  const a=agg(txForMonth(y,m));
  const over=[];
  let budgetTotal=0, overspendTotal=0;
  for(const c of EXPENSE_CATS){ const bud=+state.budgets[c.id]||0; const act=a.byCat[c.id]||0;
    if(bud>0){ budgetTotal+=bud; if(act>bud){ overspendTotal+=act-bud; over.push({cat:c.id, act, bud, by:act-bud}) } } }
  over.sort((x,z)=>z.by-x.by);
  return { inc:a.inc, exp:a.exp, byCat:a.byCat, over, budgetTotal, overspendTotal,
    adherence: budgetTotal? Math.max(0,100-overspendTotal/budgetTotal*100): null };
}
/* tax / net-pay engine (annual figures), itemised TT statutory deductions:
   - NIS: nisPct% of insurable earnings only, capped at nisCeilingMonthly x 12 (nothing above)
   - Health surcharge: flat weekly amount; lower statutory rate (TT$4.80/wk) at or under TT$469.99/mo
   - 70% of employee NIS is deductible from income before PAYE (with the personal allowance)
   - payrollDeductionPct covers OTHER deductible deductions (pension etc.)                 */
function netFromGross(grossAnnual){
  const s=state.settings, g=Math.max(0,grossAnnual);
  const nis=Math.min(g,(+s.nisCeilingMonthly||0)*12)*(+s.nisPct||0)/100;
  const surcharge=g>0? ((g/12)>469.99? (+s.healthSurchargeWeekly||0) : 4.80)*52 : 0;
  const other=g*(+s.payrollDeductionPct||0)/100;
  const taxable=Math.max(0, g-0.70*nis-other-s.taxAllowance);
  const tax=taxable<=1000000? taxable*s.taxRate/100 : 1000000*s.taxRate/100+(taxable-1000000)*0.30;
  return g-nis-surcharge-other-tax;
}
function grossForNet(netAnnual){
  let lo=0, hi=Math.max(netAnnual*2.5, state.settings.taxAllowance+netAnnual);
  for(let k=0;k<90;k++){ const mid=(lo+hi)/2; if(netFromGross(mid)<netAnnual) lo=mid; else hi=mid }
  /* netFromGross has a small step DOWN where the health surcharge switches from $4.80 to $8.25/wk;
     walk down so we return the LOWEST gross that still reaches the target net */
  let g=(lo+hi)/2, step=64;
  while(step>=0.001){ if(netFromGross(g-step)>=netAnnual) g-=step; else step/=2 }
  return g;
}
function etr(grossAnnual){ if(grossAnnual<=0) return 0; return (grossAnnual-netFromGross(grossAnnual))/grossAnnual*100 }
/* ---- minimum-wage lens ---- */
const FULLTIME_HOURS=173.33;   /* 40 h/week x 52 weeks / 12 months */
function minWageNumbers(){
  const S=state.settings;
  const grossM=(+S.minWageHourly||0)*FULLTIME_HOURS;
  const netM=grossM>0? netFromGross(grossM*12)/12 : 0;
  return {hourly:+S.minWageHourly||0, grossM, netM};
}
function pctMinWage(amountM){ const mw=minWageNumbers(); return mw.netM>0? amountM/mw.netM*100 : 0 }

/* ----------------------------------------------------------------
   IMPROVEMENT 6 — Income map recurring-only toggle
   incomeMapNumbers() now respects UI.incomeMapBase:
     't12'     → trailing-12 average income (original behaviour)
     'streams' → sum of recurring income streams only (better for
                 users with irregular windfalls in their T12 history)
---------------------------------------------------------------- */
function incomeMapNumbers(){
  const t=t12();
  const streamsMonthly=state.streams.reduce((a,s)=>a+(+s.monthly||0),0);
  /* base income: T12 average OR recurring streams only */
  const useStreams = (UI.incomeMapBase==='streams');
  const netMonthly = useStreams
    ? (streamsMonthly || t.incAvg)          /* fall back to T12 if no streams defined */
    : (t.incAvg>0? t.incAvg : streamsMonthly);
  const lifestyleM = t.expAvg;
  const savingsAllocM = t.byCatAvg.savings||0;
  const coreLifestyleM = lifestyleM - savingsAllocM;
  const savingsGoalM = netMonthly*state.settings.savingsTargetPct/100;
  const S=state.settings;
  const needLifestyle = lifestyleM*12;
  const needWithSavings = (lifestyleM+savingsGoalM)*12;
  const needComfort = needWithSavings*1.10;
  const netAnnual=netMonthly*12;
  return { t, netMonthly, streamsMonthly, lifestyleM, coreLifestyleM, savingsAllocM, savingsGoalM,
    needLifestyle, needWithSavings, needComfort, netAnnual,
    usingStreams: useStreams,
    grossCurrent: grossForNet(Math.max(1,netAnnual)),
    grossLifestyle: grossForNet(Math.max(1,needLifestyle)),
    grossWithSavings: grossForNet(Math.max(1,needWithSavings)),
    grossComfort: grossForNet(Math.max(1,needComfort)),
    gapMonthly: netMonthly-lifestyleM };
}

/* ================================================================
   PROACTIVE ALERTS  (IMPROVEMENT 6)
   The app already knows when a budget is overspent, when a project
   is behind and when data has gaps — but it only said so once you
   navigated to that view. alertsFor() turns those known facts into a
   ranked, actionable list the Dashboard can surface immediately.

   Severity drives ordering and colour only; nothing here mutates
   state. Every alert carries an optional `go` view so the UI can
   offer a one-click route to the fix.
   ================================================================ */
const SEV_RANK={critical:0,warn:1,info:2};
/* Which ledger entries count as postings of a given income stream?
   Stream id is authoritative, but entries created by the sample data, by CSV/OCR
   import or before v1.2 carry no streamId — for those, a distinctive first word of
   the stream label ("Salary (net take-home)" → "salary") is matched against the
   entry's vendor text, so a stream that IS being posted is not reported as silent. */
function txMatchesStream(t,s){
  if(t.cat!=='income') return false;
  if(t.streamId) return t.streamId===s.id;
  const word=String(s.label||'').toLowerCase().split(/[^a-z]+/).filter(w=>w.length>3)[0];
  if(!word) return false;
  return ((t.sub||'')+' '+(t.desc||'')).toLowerCase().includes(word);
}
function streamPostings(s){ return state.tx.filter(t=>txMatchesStream(t,s)) }
function alertsFor(){
  const out=[];
  const now=new Date();
  const mk=UI.month||{y:now.getFullYear(), m:now.getMonth()};
  const daysInMonth=new Date(mk.y, mk.m+1, 0).getDate();
  const isCurrentMonth = mk.y===now.getFullYear() && mk.m===now.getMonth();
  const st=monthStats(mk.y, mk.m);

  /* --- budget overages, with the remaining-days context --- */
  for(const o of st.over){
    const left=(isCurrentMonth? daysInMonth-now.getDate(): 0);
    out.push({ key:'budget:'+o.cat, sev:'warn', view:'budgets', icon:'🎯',
      title:catName(o.cat)+' is over budget',
      detail:`${fmt0(o.act)} spent against a ${fmt0(o.bud)} budget — ${fmt0(o.by)} over in ${MONTHS[mk.m]} ${mk.y}`
        + (left>0? `, with ${left} day${left===1?'':'s'} still to go` : '')+'.' });
  }

  /* --- data gaps: a month with nothing recorded breaks the T12 averages --- */
  const t=t12();
  const empty=[];
  for(const {y,m} of t.ms){ if(!txForMonth(y,m).length) empty.push(MONTHS[m]+' '+y) }
  if(empty.length){
    out.push({ key:'gap:months', sev: empty.length>=2?'warn':'info', view:'grid', icon:'🗓️',
      title: empty.length===1? 'One month has no entries' : empty.length+' months have no entries',
      detail: empty.slice(0,4).join(', ')+(empty.length>4? ' +'+(empty.length-4)+' more' : '')
        +' — trailing-12 averages treat those as zero spend.' });
  }

  /* --- recurring income streams that stopped posting --- */
  const cutoff=new Date(now.getFullYear(), now.getMonth()-2, 1);
  for(const s of state.streams){
    const posts=streamPostings(s);
    const last=posts.reduce((a,x)=> a&&a>x.date? a : x.date, null);
    if(!last || last < iso(cutoff)){
      out.push({ key:'stream:'+s.id, sev:(+s.monthly||0)>0?'warn':'info', view:'income', icon:'🔁',
        title:'Income stream “'+s.label+'” has no recent entries',
        detail: (last? 'Last posted '+last+'. ' : 'Never posted to the ledger. ')
          +'Planned at '+fmt0(+s.monthly||0)+'/mo — use “Post this month” on the Income Map.' });
    }
  }

  /* --- projects: over budget, or finished but not yet archived --- */
  for(const p of (state.projects||[])){
    if(p.archived) continue;
    const f=projectFunding(p);
    if(f.budget>0 && f.remaining<0 && p.status!=='cancelled'){
      out.push({ key:'projover:'+p.id, sev:'warn', view:'projects', icon:projectTypeEmoji(p.type),
        title:'“'+p.name+'” is over its project budget',
        detail:'Spent '+fmt0(f.actual)+' of '+fmt0(f.budget)+' — '+fmt0(-f.remaining)+' over. Raise the budget or re-scope the line items.' });
    }
    if(p.status==='completed'){
      out.push({ key:'projdone:'+p.id, sev:'info', view:'projects', icon:'✅',
        title:'“'+p.name+'” is marked completed',
        detail:'Spend '+fmt0(f.actual)+' vs budget '+fmt0(f.budget)+'. Archive it to clear the working list and keep a permanent summary.' });
    }
  }

  /* --- cashflow direction for the selected month --- */
  if(st.inc>0 && st.exp>st.inc){
    out.push({ key:'cashflow:'+mk.y+'-'+mk.m, sev:'warn', view:'plan', icon:'📉',
      title:MONTHS[mk.m]+' '+mk.y+' spent more than it earned',
      detail:'Outflows '+fmt0(st.exp)+' against inflows '+fmt0(st.inc)+' — a deficit of '+fmt0(st.exp-st.inc)+'. Plan & Advice ranks the fixes.' });
  }
  if(st.exp>0 && st.inc===0){
    out.push({ key:'noincome:'+mk.y+'-'+mk.m, sev:'info', view:'ledger', icon:'🔍',
      title:'No income recorded for '+MONTHS[mk.m]+' '+mk.y,
      detail:'Expenses of '+fmt0(st.exp)+' were recorded with no matching income — check whether payday entries are missing.' });
  }

  return out.sort((a,b)=> SEV_RANK[a.sev]-SEV_RANK[b.sev] );
}
/* alerts the user has not muted this session, plus the per-tab badge count */
function visibleAlerts(){ const d=UI.alertsDismissed||{}; return alertsFor().filter(a=>!d[a.key]) }
function alertCountFor(view){ return visibleAlerts().filter(a=>a.view===view).length }
function dismissAlert(key){ UI.alertsDismissed=UI.alertsDismissed||{}; UI.alertsDismissed[key]=1; renderAll() }
function restoreAlerts(){ UI.alertsDismissed={}; renderAll(); toast('Muted alerts restored') }

/* ================================================================
   DATA HEALTH  (IMPROVEMENT 11)
   A compact integrity score for the numbers the rest of the app
   derives. Trailing-12 averages, guideline budgets and the income
   map are only as trustworthy as the coverage behind them.
   ================================================================ */
function dataHealth(){
  const t=t12();
  const monthsChecked=t.ms.length;
  const withData=t.ms.filter(({y,m})=>txForMonth(y,m).length);
  const missing=[], emptyBoth=[];
  for(const {y,m} of t.ms){
    const imp=txForMonth(y,m);
    if(!imp.length){ missing.push({y,m,label:MONTHS[m]+' '+y}); continue }
    if(!imp.some(x=>x.cat==='income')) emptyBoth.push({y,m,label:MONTHS[m]+' '+y, kind:'no income'});
    else if(!imp.some(x=>x.cat!=='income')) emptyBoth.push({y,m,label:MONTHS[m]+' '+y, kind:'no expenses'});
  }
  const streams=state.streams.map(s=>{
    const posts=streamPostings(s);
    const last=posts.reduce((a,x)=> a&&a>x.date? a : x.date, null);
    const posted12=posts.filter(x=>txYM(x).y>=t.ms[0].y).length;
    return { label:s.label, monthly:+s.monthly||0, last, posted12, ok: !!last && posted12>0 };
  }).sort((a,b)=> (a.ok?1:0)-(b.ok?1:0));

  const income=state.tx.filter(x=>x.cat==='income').length, expense=state.tx.length-income;
  const unclassified=state.tx.filter(x=>x.cat==='other').length;
  const linked=state.tx.filter(x=>x.projectId).length;
  const attributed=state.tx.filter(x=>x.memberId).length;
  const budgeted=EXPENSE_CATS.filter(c=>+state.budgets[c.id]>0).length;

  const checks=[
    { id:'coverage', ok: missing.length===0, sev: missing.length>=3?'warn':'info', label:'Month-by-month coverage',
      detail: missing.length? missing.length+' of the last '+monthsChecked+' months have no entries ('+missing.slice(0,3).map(x=>x.label).join(', ')+(missing.length>3?'…':'')+').'
        : 'All '+monthsChecked+' months in the trailing-12 window have entries.' },
    { id:'direction', ok: emptyBoth.length===0, sev:'warn', label:'Every month has both income and expenses',
      detail: emptyBoth.length? emptyBoth.slice(0,3).map(x=>x.label+' has '+x.kind).join('; ')+(emptyBoth.length>3?'…':'')+'.'
        : 'No month is missing one side of the ledger.' },
    { id:'streams', ok: streams.length>0 && streams.every(s=>s.ok), sev:'info', label:'Recurring income streams are posting',
      detail: !streams.length? 'No income streams defined — the Income Map has no baseline to plan against.'
        : streams.filter(s=>!s.ok).length? streams.filter(s=>!s.ok).map(s=>'“'+s.label+'”'+(s.last?' last posted '+s.last:' never posted')).join('; ')+'.'
        : 'All '+streams.length+' streams have posted inside the window.' },
    { id:'classification', ok: unclassified===0, sev:'info', label:'No unclassified spending',
      detail: unclassified? unclassified+' entr'+(unclassified===1?'y is':'ies are')+' filed under “Other / unclassified”, worth '+fmt0(state.tx.filter(x=>x.cat==='other').reduce((a,x)=>a+x.amt,0))+'.'
        : 'Every entry has a real category.' },
    { id:'budgets', ok: budgeted>=8, sev:'info', label:'Budget coverage',
      detail: budgeted? budgeted+' of '+EXPENSE_CATS.length+' expense categories have a monthly budget.'
        : 'No monthly budgets set — Budgets ▸ Apply guideline budgets creates a starting set.' },
    { id:'attribution', ok: (state.household.members.length<2)||attributed>0, sev:'info', label:'Household attribution in use',
      detail: state.household.members.length<2? 'Single-contributor household — attribution is optional.'
        : attributed? attributed+' entr'+(attributed===1?'y is':'ies are')+' attributed to a member; '+linked+' linked to a project.'
        : state.household.members.length+' members defined but no expense is attributed to any of them.' }
  ];
  const score=checks.filter(c=>c.ok).length;
  return { checks, score, total:checks.length, pct: Math.round(score/checks.length*100),
    monthsChecked, monthsWithData:withData.length, missing, emptyBoth, streams,
    counts:{ income, expense, unclassified, linked, attributed, budgeted, projects:(state.projects||[]).length,

/* ================================================================

   Renders the ranked alert list at the top of the Dashboard so the
   app tells you what needs attention instead of waiting to be asked.
   ================================================================ */
function alertPanelHTML(alerts, health, all){
  all = all || alertsFor();
  const muted=all.length-alerts.length;
  const crit=alerts.filter(a=>a.sev==='critical').length;
  const warn=alerts.filter(a=>a.sev==='warn').length;
  const info=alerts.filter(a=>a.sev==='info').length;
  const sorted=[...alerts].sort((a,b)=>SEV_RANK[a.sev]-SEV_RANK[b.sev]);
  const shown=sorted.slice(0,4);
  const rest=sorted.slice(4);
  const row=a=>`
    <div class="alertrow ${a.sev}" id="al-${esc(a.key).replace(/[^a-z0-9]/gi,'_')}">
      <span class="alertico">${a.icon||'•'}</span>
      <div class="alertbody">
        <div class="alerttitle">${esc(a.title)}</div>
        <div class="alertdetail small mut">${esc(a.detail)}</div>
      </div>
      <div class="alertacts">
        ${a.view?`<button class="btn ghost small" onclick="showView('${a.view}')">Open</button>`:''}
        <button class="btn ghost small" title="Mute until reload" onclick="dismissAlert('${esc(a.key)}')">✕</button>
      </div>
    </div>`;
  const head=`<div class="cardhead"><h3 style="margin:0">🔔 Needs your attention</h3>
      <span class="grow"></span>
      ${crit?`<span class="chip red">${crit} critical</span>`:''}
      ${warn?`<span class="chip amber">${warn} to watch</span>`:''}
      ${info?`<span class="chip grey">${info} for review</span>`:''}
      <span class="chip ${health.pct>=85?'green':health.pct>=60?'amber':'red'}" title="Data health: ${health.score} of ${health.total} checks pass">📋 data health ${health.pct}%</span>
      ${muted?`<button class="btn ghost small" onclick="restoreAlerts()">↺ ${muted} muted</button>`:''}
    </div>`;
  if(!all.length){
    return `<div class="card"><div class="cardhead"><h3 style="margin:0">🔔 Needs your attention</h3><span class="grow"></span>
      <span class="chip ${health.pct>=85?'green':'amber'}">📋 data health ${health.pct}%</span></div>
      <p class="mut small" style="margin:4px 0 0">Nothing is asking for a decision right now — every budget is inside its limit, no project is over, and the trailing-12 window has data in it. 🎉</p></div>`;
  }
  return `<div class="card"><div id="alertPanelHead">${head}</div>
    ${shown.map(row).join('')}
    ${rest.length?`<details class="sec" style="margin-top:6px"><summary>${rest.length} more alert${rest.length===1?'':'s'} to review</summary><div class="inner">${rest.map(row).join('')}</div></details>`:''}
    <p class="hint" style="margin:8px 0 0">Alerts are derived live from your ledger, budgets, income streams and projects — they need no setup and are muted only for this session. Educational guidance, not financial advice.</p>
  </div>`;
}

  const txs=txForYear(y);
  const monthsWith={}; for(const t of txs){ monthsWith[txYM(t).m]=1 }
  const nMonths=Object.keys(monthsWith).length||12;
  const incKeys=[...new Set(txs.filter(t=>t.cat==='income').map(t=>(t.incomeType||guessIncomeType((t.sub||'')+' '+(t.desc||'')))+'||'+(t.sub||'Income')))];
  const incRows=incKeys.map(key=>{
    const [incomeType,s]=key.split('||');
    return {label:'💼 '+incomeTypeLabel(incomeType)+' — '+s, rows:null, incomeSub:s, incomeType,
      vals:MONTHS.map((_,m)=>round2(txForMonth(y,m).filter(t=>t.cat==='income'&&(t.incomeType||guessIncomeType((t.sub||'')+' '+(t.desc||'')))===incomeType&&(t.sub||'Income')===s).reduce((a,t)=>a+t.amt,0)))};
  });
  const expGroups=['obligations','essentials','lifestyle','occasions','future'].map(g=>({
    g, cats: CATS.filter(c=>c.grp===g).map(c=>({c, vals:MONTHS.map((_,m)=>round2(txForMonth(y,m).filter(t=>t.cat===c.id).reduce((a,t)=>a+t.amt,0)))}))
  }));
  return {y, incRows, expGroups, nMonths};
}
function renderGrid(){
  const el=$('v-grid'); const y=UI.gridYear;
  const M=gridMatrix(y);
  const sum=vals=>round2(vals.reduce((a,b)=>a+b,0));
  const avg=(vals,n)=>n? round2(sum(vals)/n):0;
  const totExpAll=M.expGroups.reduce((a,g)=>a+g.cats.reduce((b,cr)=>b+sum(cr.vals),0),0);
  /* month totals for income / expenses */
  const mInc=MONTHS.map((_,m)=>txForMonth(y,m).filter(t=>t.cat==='income').reduce((a,t)=>a+t.amt,0));
  const mExp=MONTHS.map((_,m)=>txForMonth(y,m).filter(t=>t.cat!=='income').reduce((a,t)=>a+t.amt,0));
  const mNet=mInc.map((v,i)=>round2(v-mExp[i]));
  const bud=cat=>+state.budgets[cat]||0;
  const cell=(v,cat,m)=>{
    if(!v) return '<td class="num"></td>';
    const over= cat&&bud(cat)&&v>bud(cat);
    return `<td class="num cellhit ${over?'over':''}" onclick="drill('${cat||''}',${m},${y})" title="See ${MONTHS[m]} entries">${fmt0(v)}</td>`;
  };
  const rowHTML=(label,vals,opts={})=>{
    const t=sum(vals); const a=avg(vals,M.nMonths);
    const budCell= opts.bud!==undefined? `<td class="inedit"><input type="number" step="10" min="0" value="${opts.bud||''}" placeholder="0" onchange="setBudget('${opts.cat}',this.value)"></td>`: '<td></td>';
    const delta= opts.bud? (t-opts.bud*12): null;
    const share= opts.shareOf? (t/totExpAll*100):null;
    return `<tr class="${opts.cls||''}">
      <td class="c0" ${opts.indent?'style="padding-left:22px"':''}>${label}</td>
      ${vals.map((v,m)=>cell(v,opts.cat,m)).join('')}
      <td class="num b">${t?fmt0(t):''}</td><td class="num">${t?fmt0(a):''}</td>${budCell}
      <td class="num ${delta===null?'':delta>0?'over':delta<0?'under':''}">${delta===null?'':(delta>0?'+':'−')+fmt0(Math.abs(delta))}</td>
      <td class="num mut">${share!=null&&t?share.toFixed(1)+'%':''}</td></tr>`;
  };
  const groupTotalRow=(label,vals,cls)=>`<tr class="${cls||'sub'}"><td class="c0">${label}</td>${vals.map((v,m)=>cell(v,null,m)).join('')}
      <td class="num b">${fmt0(sum(vals))}</td><td class="num">${fmt0(avg(vals,M.nMonths))}</td><td></td><td></td><td></td></tr>`;
  let body='';
  /* income block */
  body+=`<tr class="grp"><td class="c0">💰 INCOME</td>${'<td></td>'.repeat(12+5)}</tr>`;
  for(const r of M.incRows) body+=rowHTML(r.label, r.vals, {});
  body+=groupTotalRow('Total income', mInc,'sub');
  /* expense groups */
  for(const g of M.expGroups){
    const gvals=MONTHS.map((_,m)=>g.cats.reduce((a,cr)=>a+cr.vals[m],0));
    body+=`<tr class="grp"><td class="c0">${GROUPS[g.g].name.toUpperCase()}</td>${'<td></td>'.repeat(17)}</tr>`;
    for(const cr of g.cats){
      if(sum(cr.vals)===0 && !bud(cr.c.id)) continue;
      body+=rowHTML(cr.c.icon+' '+cr.c.name, cr.vals, {cat:cr.c.id, bud:bud(cr.c.id), indent:true, shareOf:true});
    }
    body+=groupTotalRow(GROUPS[g.g].name+' subtotal', gvals, 'sub');
  }
  const expAll=MONTHS.map((_,m)=>mExp[m]);
  body+=groupTotalRow('TOTAL EXPENSES', expAll,'tot');
  body+=`<tr class="tot"><td class="c0">NET (income − expenses)</td>
    ${mNet.map((v,m)=>`<td class="num ${v<0?'over':'under'}">${v?fmt0(v):''}</td>`).join('')}
    <td class="num ${sum(mNet)<0?'over':'under'}">${fmt0(sum(mNet))}</td><td class="num">${fmt0(avg(mNet,M.nMonths))}</td><td></td><td></td><td></td></tr>`;
  el.innerHTML=`
  <div class="card">
    <div class="cardhead">
      <h3 style="margin:0">🗓️ Annual spreadsheet — full year by category</h3>
      <span class="grow"></span>
      <select style="width:auto" onchange="UI.gridYear=+this.value;renderGrid()">${yearOptions(y)}</select>
      <button class="btn ghost small" onclick="exportGridCSV()">⬇️ Export grid CSV</button>
    </div>
    <p class="hint" style="margin:0 0 8px">Every cell is live — click a month cell to drill into its entries. “Δ vs budget” compares the year total with 12× your monthly budget (red = overspent). Edit the <b>Budget/mo</b> cells right in the grid.</p>
    <div class="sheet-wrap"><table class="sheet">

/* ================================================================
   YEAR OVER YEAR  (IMPROVEMENT 4)
   The plan view answers “am I making progress?” but had no historical
   anchor. This compares the selected grid year with any other year,
   by group and by category, with per-month averages so a part-year
   dataset is compared fairly.
   ================================================================ */
function yearTotalsFor(y){
  const txs=txForYear(y);
  const inc=txs.filter(t=>t.cat==='income').reduce((a,t)=>a+t.amt,0);
  const exp=txs.filter(t=>t.cat!=='income').reduce((a,t)=>a+t.amt,0);
  const monthsWith=new Set(txs.map(t=>txYM(t).m)).size;
  const effMonths=monthsWith||1;
  const byCat={}; for(const t of txs){ if(t.cat!=='income') byCat[t.cat]=(byCat[t.cat]||0)+t.amt }
  return {y, inc, exp, net:inc-exp, count:txs.length, monthsWith, effMonths, byCat};
}
function yoyYears(cur){
  const ys=[...new Set([...state.tx.map(t=>txYM(t).y), cur])].sort((a,b)=>b-a);
  return ys.length? ys : [cur];
}
function yoyCardHTML(y){
  const cur=yearTotalsFor(y);
  const priorYears=yoyYears(y).filter(x=>x!==y);
  const py = (UI.compareYear && priorYears.includes(UI.compareYear)) ? UI.compareYear
           : (priorYears.includes(y-1)? y-1 : (priorYears[0]!==undefined? priorYears[0] : null));
  const selOpts=priorYears.map(x=>`<option value="${x}" ${x===py?'selected':''}>${x}</option>`).join('');
  if(py===null){
    return `<div class="card"><div class="cardhead"><h3 style="margin:0">📅 Year over year</h3><span class="grow"></span>
      <span class="chip grey">${y}</span></div>
      <p class="mut small" style="margin:4px 0 0">Only ${y} has entries so far. Once a second year is recorded, this panel compares both side by side — spending by group, by category, and per month.</p></div>`;
  }
  const prev=yearTotalsFor(py);
  const curM=cur.inc-cur.exp, prevM=prev.inc-prev.exp;
  const expDelta=cur.exp-prev.exp, incDelta=cur.inc-prev.inc;
  const avg=(v,yy)=>v/(yy.effMonths||1);
  const sign=v=>v>0?'+':'−';
  const yo=(html,cls)=>`<div class="alertrow ${cls}" style="margin:0 0 12px">${html}</div>`;

  const row=(label, groupColor, cVals, pVals, effC, effP, isCat)=>{
    const ct=cVals.reduce((a,b)=>a+b,0), pt=pVals.reduce((a,b)=>a+b,0);
    const ca=ct/(effC||1), pa=pt/(effP||1);
    const d=ct-pt, dp= pa>0? (d/pa*100) : (ct>0? 100 : 0);
    const cls= d>0.005? 'delta-up' : d<-0.005? 'delta-down' : 'delta-flat';
    const arrow= d>0.005? '▲' : d<-0.005? '▼' : '▬';
    return `<tr>
      <td${isCat?' style="padding-left:12px"':''}>${label}</td>
      <td class="num">${ct? fmt0(ct):''}</td><td class="num mut">${ct? fmt0(ca):''}</td>
      <td class="num">${pt? fmt0(pt):''}</td><td class="num mut">${pt? fmt0(pa):''}</td>
      <td class="num ${cls}">${(ct||pt)? arrow+' '+fmt0(Math.abs(d)) : ''}</td>
      <td class="num ${cls}">${(ct||pt)? (dp>=0?'+':'−')+Math.abs(dp).toFixed(1)+'%' : ''}</td></tr>`;
  };
  const aTot=MONTHS.map((_,m)=>txForMonth(py,m).filter(t=>t.cat==='income').reduce((a,t)=>a+t.amt,0));  const bTot=MONTHS.map((_,m)=>txForMonth(y,m).filter(t=>t.cat==='income').reduce((a,t)=>a+t.amt,0));
  const aExp=MONTHS.map((_,m)=>txForMonth(py,m).filter(t=>t.cat!=='income').reduce((a,t)=>a+t.amt,0));
  const bExp=MONTHS.map((_,m)=>txForMonth(y,m).filter(t=>t.cat!=='income').reduce((a,t)=>a+t.amt,0));

  let body='';
  body+=`<tr class="grp"><td>💰 INCOME</td><td colspan="6"></td></tr>`;

  for(const g of ['obligations','essentials','lifestyle','occasions','future']){
    const gc=CATS.filter(c=>c.grp===g);

    body+=`<tr class="grp"><td>${GROUPS[g].name.toUpperCase()}</td><td colspan="6"></td></tr>`;

      body+=row(c.icon+' '+esc(c.name), null, [ct], [pt], cur.effMonths, prev.effMonths, true);
    }
    const gSumC=gc.reduce((a,c)=>a+(+cur.byCat[c.id]||0),0), gSumP=gc.reduce((a,c)=>a+(+prev.byCat[c.id]||0),0);
    body+=row('<b>'+esc(GROUPS[g].name)+' subtotal</b>', null, [gSumC], [gSumP], cur.effMonths, prev.effMonths, false);
  }
  const bExpTot=bExp.reduce((a,b)=>a+b,0), aExpTot=aExp.reduce((a,b)=>a+b,0);
  body+=`<tr class="tot"><td>TOTAL EXPENSES</td><td colspan="6"></td></tr>`;
  body+=row('<b>Total expenses</b>', null, [bExpTot], [aExpTot], cur.effMonths, prev.effMonths, false);

  const verdict = expDelta<-0.005 && bExpTot>0
    ? {cls:'info', icon:'📉', text:`Spending is down ${fmt0(Math.abs(expDelta))} vs ${py} (${Math.abs(expDelta/(aExpTot||1)*100).toFixed(1)}% lower) — progress.`}
    : expDelta>0.005 && bExpTot>0
      ? {cls:'warn', icon:'📈', text:`Spending is up ${fmt0(expDelta)} vs ${py} (${(expDelta/(aExpTot||1)*100).toFixed(1)}% higher), while income ${incDelta>=0?'rose':'fell'} ${fmt0(Math.abs(incDelta))}.`}
      : {cls:'info', icon:'➖', text:`Spending is broadly level with ${py} (${sign(expDelta)}${fmt0(Math.abs(expDelta))}).`};
  const netVerdict = cur.net>prev.net+0.005
    ? `<span class="chip green">net improved ${fmt0(cur.net-prev.net)}</span>`
    : cur.net<prev.net-0.005
      ? `<span class="chip red">net worsened ${fmt0(prev.net-cur.net)}</span>`
      : `<span class="chip grey">net unchanged</span>`;

  return `<div class="card">
    <div class="cardhead"><h3 style="margin:0">📅 Year over year</h3><span class="grow"></span>
      <span class="chip grey">compare ${y} against</span>
      <select style="width:auto" onchange="UI.compareYear=+this.value;renderGrid()">${selOpts}</select>
      ${netVerdict}
    </div>
    <p class="hint" style="margin:0 0 10px">Per-month and per-entry columns divide by the number of months that actually have entries, so a year that is still in progress is not flattered or penalised by empty months. Red = higher than ${py}; green = lower.</p>
    ${yo(`<span class="alertico">${verdict.icon}</span><div class="alertbody">${esc(verdict.text)}</div>`, verdict.cls)}
    <div class="kpis">
      <div class="kpi"><div class="lbl">Income ${y}</div><div class="v pos">${fmt0(cur.inc)}</div><div class="sub">${fmt0(avg(cur.inc,cur))}/mo · ${y===new Date().getFullYear()?'year to date':cur.monthsWith+' months'}</div></div>
      <div class="kpi"><div class="lbl">Income ${py}</div><div class="v pos">${fmt0(prev.inc)}</div><div class="sub">${fmt0(avg(prev.inc,prev))}/mo · ${prev.monthsWith} months</div></div>
      <div class="kpi"><div class="lbl">Spending ${y}</div><div class="v">${fmt0(cur.exp)}</div><div class="sub">${fmt0(avg(cur.exp,cur))}/mo</div></div>
      <div class="kpi"><div class="lbl">Spending ${py}</div><div class="v">${fmt0(prev.exp)}</div><div class="sub">${fmt0(avg(prev.exp,prev))}/mo</div></div>
      <div class="kpi"><div class="lbl">Net ${y}</div><div class="v ${cur.net>=0?'pos':'neg'}">${fmt0(cur.net)}</div><div class="sub">${cur.count} entries</div></div>
      <div class="kpi"><div class="lbl">Net ${py}</div><div class="v ${prev.net>=0?'pos':'neg'}">${fmt0(prev.net)}</div><div class="sub">${prev.count} entries</div></div>
    </div>
    <div class="scrollx"><table class="t">
      <thead><tr><th>Category</th><th class="num">${y} total</th><th class="num">${y} /mo</th><th class="num">${py} total</th><th class="num">${py} /mo</th><th class="num">Δ change</th><th class="num">Δ %</th></tr></thead>
      <tbody>${body}</tbody></table></div>
  </div>`;
}

function applyGuidelineBudgets(){
  const netRef=t12().incAvg||state.streams.reduce((a,s)=>a+(+s.monthly||0),0);
  if(netRef<=0){ toast('Add income first — guidelines are based on net income'); return }
  let n=0; for(const c of EXPENSE_CATS){ if(c.guide){ state.budgets[c.id]=Math.round(netRef*c.guide/100/10)*10; n++ } }
  store.save(); renderAll(); toast('Set '+n+' guideline budgets based on '+fmt0(netRef)+'/mo net income');
}
function clearBudgets(){ state.budgets={}; store.save(); renderAll(); toast('Budgets cleared') }

/* ----------------------------------------------------------------
   IMPROVEMENT 3 — Personalised dynamic quick wins
   Replaces boilerplate tips with ranked, user-data-driven suggestions
   drawn from actual spending patterns, overspent categories, and
   subscription / dining / loan totals.
---------------------------------------------------------------- */
function buildQuickWins(t, excess, netRef){
  const wins=[];
  /* 1. Subscriptions: if user has any subscription spend flag it specifically */
  const subSpend=t.byCatAvg.subscriptions||0;
  if(subSpend>0){
    wins.push({score:subSpend, text:`You average ${fmt0(subSpend)}/mo on subscriptions. Auditing for unused or duplicate services typically recovers 20–40% — that's up to ${fmt0(subSpend*0.4)}/mo.`});
  }
  /* 2. Dining: if above guideline */
  const diningSpend=t.byCatAvg.dining||0;
  const diningGuide=netRef*(CAT.dining.guide||7)/100;
  if(diningSpend>diningGuide){
    const saving=diningSpend-diningGuide;
    wins.push({score:saving, text:`Dining averages ${fmt0(diningSpend)}/mo — ${fmt0(saving)}/mo above the ${CAT.dining.guide}% guideline. Two extra meal-prep days per week typically cuts restaurant spend by 25–30%, freeing ${fmt0(diningSpend*0.27)}/mo.`});
  }
  /* 3. Top overspent category (if not already dining) */
  const topOver=excess.find(x=>x.c.id!=='dining'&&x.c.id!=='loans');
  if(topOver){
    wins.push({score:topOver.excess, text:`${topOver.c.icon} ${topOver.c.name} is your biggest category overage: ${fmt0(topOver.spend)}/mo vs a ${topOver.c.guide}% guideline of ${fmt0(topOver.guide)}/mo. Bringing it to guideline saves ${fmt0(topOver.excess*12)}/yr.`});
  }
  /* 4. Insurance: always worth a re-quote nudge */
  const insSpend=t.byCatAvg.insurance||0;
  if(insSpend>0){
    wins.push({score:insSpend*0.12, text:`Insurance averages ${fmt0(insSpend)}/mo. Bundling motor and home cover and re-quoting annually typically saves 10–15% — about ${fmt0(insSpend*0.12)}/mo in your case.`});
  }
  /* 5. Loans: suggest refinancing if it's a large share */
  const loanSpend=t.byCatAvg.loans||0;
  if(loanSpend>netRef*0.30){
    wins.push({score:loanSpend*0.02, text:`Loan repayments take ${(loanSpend/netRef*100).toFixed(0)}% of your net income (${fmt0(loanSpend)}/mo). Ask your lender about refinancing — even a 0.5% rate reduction on ${fmt0(loanSpend)}/mo of obligations matters significantly over the life of the loan.`});
  }
  /* 6. Auto / fuel: if meaningful */
  const autoSpend=t.byCatAvg.auto||0;
  if(autoSpend>0){
    wins.push({score:autoSpend*0.08, text:`Auto costs (fuel, licensing) average ${fmt0(autoSpend)}/mo. Consolidating trips and checking tyre pressure monthly can reduce fuel consumption by 5–10% — roughly ${fmt0(autoSpend*0.08)}/mo.`});
  }
  /* 7. Structural gap fallback */
  if(wins.length<3){
    wins.push({score:0, text:'Your spending categories are close to guideline. The gap is likely structural — focus on the Income Map revenue target and consider refinancing fixed obligations.'});
  }
  /* sort by estimated saving, take top 5 */
  return wins.sort((a,b)=>b.score-a.score).slice(0,5).map(w=>w.text);
}

/* ---- image flow ---- */
function handleImgFile(f){
  if(!f) return;
  if(!/^image\//.test(f.type)){ toast('Please choose an image file (JPG/PNG)'); return }
  if(UI.ocrURL) URL.revokeObjectURL(UI.ocrURL);
  UI.ocrFile=f; UI.ocrURL=URL.createObjectURL(f); UI.ocrMsg='';
  renderIngest();
  if(UI.ocrOn) runOCR();
}
let tessPromise=null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(!tessPromise) tessPromise=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';   /* pinned — major-only floats can break silently */
    s.onload=()=>res(); s.onerror=()=>{ tessPromise=null; rej(new Error('offline')) };
    document.head.appendChild(s);
  });
  return tessPromise;
}
async function runOCR(){
  if(!UI.ocrFile){ toast('Choose an invoice or screenshot image first'); return }
  if(!UI.ocrOn){ UI.ocrMsg='Tick “Try OCR” first (it needs internet).'; renderIngest(); return }
  UI.ocrMsg='⏳ Loading OCR engine (first use downloads ~2 MB)…'; renderIngest();
  try{
    await loadTesseract();
    UI.ocrMsg='⏳ Reading image…'; renderIngest();
    const res=await window.Tesseract.recognize(UI.ocrFile,'eng');
    const text=(res.data&&res.data.text)||'';
    const cands=parseText(text, UI.imgSrc||'invoice');
    UI.ocrMsg = cands.length? 'OCR finished — review the parsed entries below.':'OCR finished but no amounts were found — use the quick-entry form beside the image.';
    UI.candidates=cands;
  }catch(e){
    UI.ocrMsg='⚠️ OCR unavailable here (offline or blocked). The image preview stays above — type the details into the quick-entry form. When this file is opened in a normal browser with internet, OCR will work.';
  }
  renderIngest();
}

/* ---- the heuristic parser (works on OCR text, emails, statements) ---- */
function mkISO(y,m,d){ m=Math.min(12,Math.max(1,m)); d=Math.min(31,Math.max(1,d));
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0') }
function extractDate(s){
  s=String(s||'');
  let m=s.match(/(20\d{2})-(\d{1,2})-(\d{1,2})/); if(m) return mkISO(+m[1],+m[2],+m[3]);
  m=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](20\d{2})/); if(m) return mkISO(+m[3],+m[2],+m[1]); /* d/m/yyyy */
  const MO='jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec';
  m=s.match(new RegExp('(\\d{1,2})\\s+('+MO+')[a-z]*\\s*,?\\s*(20\\d{2})','i')); if(m) return mkISO(+m[3], 1+MO.split('|').indexOf(m[2].toLowerCase()), +m[1]);
  m=s.match(new RegExp('('+MO+')[a-z]*\\.?\\s+(\\d{1,2}),?\\s*(20\\d{2})','i')); if(m) return mkISO(+m[3], 1+MO.split('|').indexOf(m[1].toLowerCase()), +m[2]);
  return null;
}
function guessVendorLine(l){
  for(const words of Object.values(VENDOR_HINTS)){ for(const w of words){ if(l.toLowerCase().includes(w)) return w.replace(/\b\w/g,c=>c.toUpperCase()) } }
  const cleaned=l.replace(/[\d,.$€£]/g,' ').replace(/\s+/g,' ').trim();
  const words=cleaned.split(' ').filter(w=>w.length>2).slice(0,3);
  return words.length? words.map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' '): '';
}
function parseText(raw, src){
  const lines=String(raw||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const fromM=String(raw).match(/^From:\s*(.+)$/mi); const fromVendor=fromM? vendorFromEmail(fromM[1]):null;
  const subjM=String(raw).match(/^Subject:\s*(.+)$/mi);
  const cands=[], seen={};
  for(const l of lines){
    if(/^(from|to|cc|bcc|subject|date|sent|reply|return-path|delivered-to|received|content-type|mime|dkim|spf|authentication-results|x-|>--|^--$|={3,}|#{3,}|\*{3,})/i.test(l) && !/total|amount|due|paid|balance|charged/i.test(l)) continue;
    const amts=[...l.matchAll(/(?:tt\$|ttd|us\$|usd|\$|€|£|rs\.?)?\s*([\d,]+\.\d{2})\b/gi)].map(m=>+m[1].replace(/,/g,''));
    if(!amts.length) continue;
    const isTotal=/(grand total|total due|amount due|balance due|amount payable|total paid|pay this amount|invoice total|order total|total:)/i.test(l);
    const amt=isTotal? Math.max(...amts): amts[amts.length-1];
    const key=l.toLowerCase().replace(/[^a-z0-9.]/g,'');
    if(seen[key]) continue; seen[key]=1;
    const vendor=fromVendor||guessVendorLine(l)||'';
    const combined=l+' '+vendor+' '+(subjM?subjM[1]:'');
    const cat=guessCat(combined)||'other';
    const incomeType=cat==='income'?guessIncomeType(combined):undefined;
    cands.push({ date: extractDate(l)||extractDate(String(raw))||todayISO(), amount:amt,
      vendor, desc:(subjM&&!isTotal? subjM[1].slice(0,60): l.replace(/[\t ]+/g,' ').slice(0,70)),
      cat, ...(incomeType?{incomeType}:{}), src:src||'manual', conf:(isTotal||fromVendor)?'high':'verify' });
    if(cands.length>=30) break;
  }
  return cands;
}
function importCandidates(){

function handleCSVFile(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const res=parseCSVText(String(r.result||''));

    else { UI.csvMsg='✔ Read '+res.cands.length+' rows — preview below, then import.'; UI.csvCands=res.cands }
    renderIngest();
  };
  r.readAsText(f);
}
function csvLine(l){ const out=[]; let cur='',q=false;
  for(const ch of l){ if(ch==='"'){ q=!q } else if(ch===','&&!q){ out.push(cur); cur='' } else cur+=ch }
  out.push(cur); return out.map(s=>s.trim());
}
function matchCatName(name){
  const s=String(name||'').toLowerCase().replace(/[^a-z]/g,'');
  if(!s) return null;
  for(const c of CATS){ if(s===c.id||s===c.name.toLowerCase().replace(/[^a-z]/g,'')) return c.id }
  for(const c of CATS){ if(s.includes(c.id)||c.name.toLowerCase().replace(/[^a-z]/g,'').includes(s)) return c.id }
  return null;
}
function parseCSVText(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return {error:'empty file'};
  const head=csvLine(lines[0]).map(h=>h.toLowerCase());
  const find=(...names)=>{ for(const nm of names){ const i=head.findIndex(h=>h===nm||h.startsWith(nm)); if(i>=0) return i } return -1 };
  let iDate=find('date'), iAmt=find('amount','amt','value','total','sum'), iDesc=find('description','desc','details','memo','notes','narrative','particulars'),
      iVen=find('vendor','merchant','payee','store','company'), iCat=find('category','cat','type','tag');
  if(iDate<0||iAmt<0){
    /* maybe headerless: date,description,amount */
    const t1=csvLine(lines[0]);
    if(t1.length>=3 && /^\d/.test(t1[0]) && !isNaN(parseFloat(t1[t1.length-1].replace(/[^\d.]/g,'')))){
      iDate=0; iDesc=1; iAmt=t1.length-1; iVen=-1; iCat=-1; lines.unshift([]);
    } else return {error:'Could not find date/amount columns. Use the template to see the expected headers.'};
  }
  const cands=[];
  for(let r=1;r<lines.length;r++){
    const c=csvLine(lines[r]);
    if(!c[iDate]) continue;
    const amt=Math.abs(parseAmt(c[iAmt])); if(!amt) continue;
    const desc=iDesc>=0? c[iDesc]:'';
    const ven=iVen>=0? c[iVen]:'';
    const cat=(iCat>=0&&matchCatName(c[iCat]))||guessCat(desc+' '+ven)||'other';
    const incomeType=cat==='income'?guessIncomeType(desc+' '+ven):null;
    const dt=extractDate(c[iDate])||todayISO();
    cands.push({date:dt, amount:round2(amt), vendor:ven, desc, cat, ...(incomeType?{incomeType}:{}), src:'csv'});
  }
  return {cands};
}
function importCSV(){
  let n=0;

   numbers; this makes the split visible — a stacked bar for the whole

function householdSplit(y,m){
  const tx=txForMonth(y,m).filter(t=>t.cat!=='income');
  const total=round2(tx.reduce((a,t)=>a+t.amt,0));
  const buckets=state.household.members.map((mem,i)=>({
    id:mem.id, name:mem.name, role:mem.role||'Contributor',
    val:round2(tx.filter(t=>t.memberId===mem.id).reduce((a,t)=>a+t.amt,0)),
    color:MEMBER_COLORS[i%MEMBER_COLORS.length]
  }));
  const shared=round2(tx.filter(t=>!t.memberId||!state.household.members.some(mem=>mem.id===t.memberId))
    .reduce((a,t)=>a+t.amt,0));
  if(shared>0) buckets.push({id:'__shared', name:'🏠 Household / shared', role:'Not attributed', val:shared, color:'#94a3b8', shared:true});
  const attributed=round2(total-shared);
  return { y, m, total, buckets: buckets.filter(b=>b.val>0||!b.shared), shared, attributed,
    attributedPct: total? attributed/total*100 : 0,

}
